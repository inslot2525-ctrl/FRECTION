# Render blueprint: New + > Blueprint > pick this repository.
#
# The free plan has 512 MB RAM, too little for PyTorch, so the GNN risk score is
# left out here. Render passes environment variables to the Docker build as build
# arguments, which is how WITH_GNN reaches the Dockerfile.
services:
  - type: web
    name: frection
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: WITH_GNN
        value: "0"
      - key: ANTHROPIC_API_KEY     # optional: enables AI summaries; leave blank to keep them off
        sync: false
